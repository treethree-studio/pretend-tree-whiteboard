name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install asset tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate Windows icon from official logo
        run: python scripts/generate_app_icon.py

      - name: Validate editor scripts
        shell: pwsh
        run: |
          Get-ChildItem renderer\editor*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node --check main.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check preload.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: pretend-tree-whiteboard-windows-brand
          path: app/dist/*.exe
          if-no-files-found: error
